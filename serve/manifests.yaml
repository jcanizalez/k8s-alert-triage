---
apiVersion: v1
kind: Namespace
metadata:
  name: triage
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: triage
  namespace: triage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: triage-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "events"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: triage-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: triage-reader
subjects:
  - kind: ServiceAccount
    name: triage
    namespace: triage
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-weights
  namespace: triage
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: standard
  resources:
    requests:
      storage: 3Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-server
  namespace: triage
spec:
  replicas: 1
  selector:
    matchLabels: { app: llama-server }
  template:
    metadata:
      labels: { app: llama-server }
    spec:
      containers:
        - name: llama-server
          image: ghcr.io/ggml-org/llama.cpp:server
          args:
            - "-m"
            - "/models/model.gguf"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8080"
            - "-c"
            - "2048"
            - "--reasoning"
            - "off"
            - "-np"
            - "1"
            - "-t"
            - "2"
          ports:
            - containerPort: 8080
          volumeMounts:
            - { name: models, mountPath: /models }
          resources:
            requests: { cpu: "1", memory: 2Gi }
            limits: { cpu: "2", memory: 5Gi }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: model-weights
---
apiVersion: v1
kind: Service
metadata:
  name: llama-server
  namespace: triage
spec:
  selector: { app: llama-server }
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triage
  namespace: triage
spec:
  replicas: 1
  selector:
    matchLabels: { app: triage }
  template:
    metadata:
      labels: { app: triage }
    spec:
      serviceAccountName: triage
      containers:
        - name: triage
          image: triage:dev
          imagePullPolicy: IfNotPresent
          env:
            - { name: LLAMA_URL, value: "http://llama-server:8080/v1/chat/completions" }
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: "1", memory: 256Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: triage
  namespace: triage
spec:
  selector: { app: triage }
  ports:
    - port: 8080
      targetPort: 8080
