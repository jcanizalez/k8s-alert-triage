<svg xmlns="http://www.w3.org/2000/svg" width="700" height="600" viewBox="0 0 700 600"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6B76"/></marker></defs><rect width="700" height="600" fill="#FFFFFF"/><text x="40" y="34" font-family="ui-monospace, &#x27;SF Mono&#x27;, Menlo, monospace" font-size="15" fill="#1F2328" font-weight="700" text-anchor="start">qwen3-1.7b-triage-16bit-q8_0.gguf, 1.71 GiB, one file</text><rect x="40" y="56" width="620" height="44" rx="4" fill="#E8F1FB" stroke="#4A90D9" stroke-width="1.5"/><text x="56" y="84" font-family="ui-monospace, &#x27;SF Mono&#x27;, Menlo, monospace" font-size="15" fill="#2B6CB0" font-weight="600" text-anchor="start">GGUF  version 3  ·  310 tensors  ·  30 metadata keys</text><rect x="40" y="112" width="620" height="232" rx="4" fill="#F3EAF7" stroke="#9B59B6" stroke-width="1.5"/><text x="56" y="138" font-family="-apple-system, &#x27;Helvetica Neue&#x27;, Arial, sans-serif" font-size="14" fill="#9B59B6" font-weight="700" text-anchor="start">metadata: what the model is and how to talk to it</text><text x="56" y="164" font-family="ui-monospace, &#x27;SF Mono&#x27;, Menlo, monospace" font-size="14" fill="#1F2328" font-weight="400" text-anchor="start">general.architecture</text><text x="330" y="164" font-family="ui-monospace, &#x27;SF Mono&#x27;, Menlo, monospace" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">= qwen3</text><text x="56" y="188" font-family="ui-monospace, &#x27;SF Mono&#x27;, Menlo, monospace" font-size="14" fill="#1F2328" font-weight="400" text-anchor="start">qwen3.block_count</text><text x="330" y="188" font-family="ui-monospace, &#x27;SF Mono&#x27;, Menlo, monospace" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">= 28</text><text x="56" y="212" font-family="ui-monospace, &#x27;SF Mono&#x27;, Menlo, monospace" font-size="14" fill="#1F2328" font-weight="400" text-anchor="start">qwen3.embedding_length</text><text x="330" y="212" font-family="ui-monospace, &#x27;SF Mono&#x27;, Menlo, monospace" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">= 2048</text><text x="56" y="236" font-family="ui-monospace, &#x27;SF Mono&#x27;, Menlo, monospace" font-size="14" fill="#1F2328" font-weight="400" text-anchor="start">qwen3.context_length</text><text x="330" y="236" font-family="ui-monospace, &#x27;SF Mono&#x27;, Menlo, monospace" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">= 40,960</text><text x="56" y="260" font-family="ui-monospace, &#x27;SF Mono&#x27;, Menlo, monospace" font-size="14" fill="#1F2328" font-weight="400" text-anchor="start">general.file_type</text><text x="330" y="260" font-family="ui-monospace, &#x27;SF Mono&#x27;, Menlo, monospace" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">= 7  (Q8_0)</text><text x="56" y="284" font-family="ui-monospace, &#x27;SF Mono&#x27;, Menlo, monospace" font-size="14" fill="#1F2328" font-weight="400" text-anchor="start">tokenizer.ggml.tokens</text><text x="330" y="284" font-family="ui-monospace, &#x27;SF Mono&#x27;, Menlo, monospace" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">= [151,936 strings]</text><text x="56" y="308" font-family="ui-monospace, &#x27;SF Mono&#x27;, Menlo, monospace" font-size="14" fill="#1F2328" font-weight="400" text-anchor="start">tokenizer.ggml.merges</text><text x="330" y="308" font-family="ui-monospace, &#x27;SF Mono&#x27;, Menlo, monospace" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">= [151,387 pairs]</text><text x="56" y="332" font-family="ui-monospace, &#x27;SF Mono&#x27;, Menlo, monospace" font-size="14" fill="#1F2328" font-weight="400" text-anchor="start">tokenizer.chat_template</text><text x="330" y="332" font-family="ui-monospace, &#x27;SF Mono&#x27;, Menlo, monospace" font-size="14" fill="#1F2328" font-weight="600" text-anchor="start">